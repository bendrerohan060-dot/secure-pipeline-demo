name: Secure CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: echo "Tests Passed"

  sast:
    name: SAST Scan (SonarQube)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: SAST Scan Simulation
        run: echo "SonarQube Scan Completed - No Critical Issues"

  dast:
    name: DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: DAST Scan Simulation
        run: echo "ZAP Scan Completed - No Vulnerabilities"

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: dast

    steps:
      - name: Deploy Step
        run: echo "Application Deployed Successfully"